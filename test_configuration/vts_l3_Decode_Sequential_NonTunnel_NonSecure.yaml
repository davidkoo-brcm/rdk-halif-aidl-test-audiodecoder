              - 21333333
              - 42666666
              - 63999999
              - 85333332
              - 106666665
              - 127999998
              - 149333331
              - 170666664
              - 191999997
            trim: &id002  #Start and end trim points in Nano seconds
              - 0 #Start in Nano seconds
              - 0 #End
            decode_time_threshold: 10000000 #Time budget per frame for decoding, in nanoseconds
            rms_diff_threshold: 0.5 #Maximum allowed `rms` difference for output validation
