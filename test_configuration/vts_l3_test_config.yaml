        - Name: tones_48k_2_256_aac
          PTS:
            - 0
            - 21333333
            - 42666666
            - 63999999
            - 85333332
            - 106666665
            - 127999998
            - 149333331
            - 170666664
            - 191999997
          trim:
            - 0 #Start in Nano seconds
            - 0 #End
          rms_diff_threshold: 0.5
          decode_time_threshold: 10000000 #Time in nano seconds