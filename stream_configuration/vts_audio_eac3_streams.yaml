AudioStreams:
  vts_eac3_48k_1ch_64k_eac3:
    input: vts_eac3_48k_1ch_64k.eac3            # Stream name
    reference: vts_eac3_48k_1ch_64k_ref.pcm      # Reference stream name
    codec: DOLBY_AC3_PLUS                        # audio codec information (E-AC-3)
    sample_rate: 48000                           # Sample rate in Hz
    channels: 1                                  # Number of audio channels (mono)
    format: S16LE                                # PCM format of the reference stream
    num_of_frames: 10                            # Total number of E-AC-3 syncframes
    duration: 320000000 # (1536 samples/frame x 10 frames x 1e9) / 48000 Hz
    frame_size:                                 # Byte size for each E-AC-3 syncframe
      - 256
      - 256
      - 256
      - 256
      - 256
      - 256
      - 256
      - 256
      - 256
      - 256

